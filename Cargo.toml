[workspace]
members = [
    "input-capture",
    "input-emulation",
    "input-event",
    "lan-mouse-ipc",
    "lan-mouse-cli",
    "lan-mouse-gtk",
    "lan-mouse-launcher",
    "lan-mouse-proto",
]

[package]
name = "lan-mouse"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"
embed-resource = "3.0"

[dependencies]
input-event = { path = "input-event", version = "0.3.0" }
input-emulation = { path = "input-emulation", version = "0.3.0", default-features = false }
input-capture = { path = "input-capture", version = "0.3.0", default-features = false }
lan-mouse-cli = { path = "lan-mouse-cli", version = "0.2.0" }
lan-mouse-gtk = { path = "lan-mouse-gtk", version = "0.2.0", optional = true }
lan-mouse-ipc = { path = "lan-mouse-ipc", version = "0.2.0" }
lan-mouse-proto = { path = "lan-mouse-proto", version = "0.2.0" }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

hickory-resolver = "0.25.2"
hostname = "0.4.0"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"
mdns-sd = { version = "0.12", optional = true }
arboard = { version = "3", optional = true }

# file_drop feature deps (QUIC side channel + clipboard-image-as-file bridge)
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"], optional = true }
zstd = { version = "0.13", optional = true }
ciborium = { version = "0.2", optional = true }
blake3 = { version = "1", optional = true }
png = { version = "0.17", optional = true }
rustls-pemfile = { version = "2", optional = true }
# webrtc-dtls writes keys with a non-standard PEM label (`PRIVATE_KEY`),
# so file_drop parses the on-disk bundle via the `pem` crate directly.
pem = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[features]
default = [
    "gtk",
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
    "discovery",
    "clipboard",
    "file_drop",
]
gtk = ["dep:lan-mouse-gtk"]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]
discovery = ["dep:mdns-sd"]
clipboard = ["dep:arboard"]
file_drop = [
    "dep:quinn",
    "dep:zstd",
    "dep:ciborium",
    "dep:blake3",
    "dep:png",
    "dep:rustls-pemfile",
    "dep:pem",
    "input-capture/file_drop",
]

[package.metadata.bundle]
# macOS .app bundle name — cargo-bundle turns this into the output
# filename, and `+` trips up some downstream tools (shells, notarisation
# pipelines). Keep the display form "Lan Mouse Plus" here; the live UI
# still reads "Lan Mouse+" via the desktop file / GTK title.
name = "Lan Mouse Plus"
icon = ["target/icon.icns"]
identifier = "de.feschber.LanMouse"
