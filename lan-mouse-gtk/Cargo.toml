[package]
name = "lan-mouse-gtk"
description = "GTK4 / Libadwaita Frontend for lan-mouse"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_2"] }
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_4"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
if-addrs = "0.13"
log = "0.4.20"
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.2.0" }
thiserror = "2.0.0"
# file_transfer_window persists its last-chosen folder to a small JSON
# state file; serde handles (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
glib-build-tools = { version = "0.20.0" }

# Windows-only: ShellExecuteExW for the "Run as administrator" elevation
# used by the Windows Service control buttons in the settings panel.
# Win32_System_Registry is needed because SHELLEXECUTEINFOW carries an HKEY
# field, and windows-sys gates the struct on that feature.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }
lan-mouse-service = { path = "../lan-mouse-service", version = "0.1.0" }
