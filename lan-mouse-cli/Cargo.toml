[package]
name = "lan-mouse-cli"
description = "CLI Frontend for lan-mouse"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
futures = "0.3.30"
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.2.0" }
clap = { version = "4.4.11", features = ["derive"] }
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "rt",
] }

# Windows-only deps:
#   - windows-sys: MessageBox for the Explorer "Send via Lan Mouse+" verb
#     so the user gets visible feedback (CLI stdout/stderr is invisible
#     when invoked from a shell verb).
#   - lan-mouse-service: install/uninstall/start/stop/status helpers for
#     the `lan-mouse cli service ...` subcommands.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
lan-mouse-service = { path = "../lan-mouse-service", version = "0.1.0" }
